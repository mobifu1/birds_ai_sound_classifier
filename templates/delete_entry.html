<!DOCTYPE html>
<html>
<head>
    <title>Eintrag Bearbeiten / Löschen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 20px auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #f57c00; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #333; }
        .section { background: #263238; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #37474f; }
        .row { display: flex; flex-direction: column; margin-bottom: 15px; }
        .date-range-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .date-range-col { flex: 1 1 200px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; }
        input[type=date], select.filter-select { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; width: 100%; box-sizing: border-box; font-size: 1em; }
        button, .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; display: inline-block; text-decoration: none; text-align: center; }
        .btn-red { background: #d32f2f; } .btn-red:hover { background: #b71c1c; }
        .btn-gray { background: #546e7a; } .btn-gray:hover { background: #607d8b; }
        .btn-orange { background: #f57c00; } .btn-orange:hover { background: #e65100; }
        .btn-green { background: #2e7d32; } .btn-green:hover { background: #1b5e20; }
        .btn-nav { margin-bottom: 20px; }
        select.edit-select { padding: 5px; border-radius: 4px; border: 1px solid #444; background: #121212; color: #fff; width: 100%; box-sizing: border-box; font-size: 0.9em; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: #37474f; color: #fff; }
        tr:hover { background-color: #333; }
        .empty-msg { text-align: center; font-style: italic; color: #999; margin-top: 20px; }
        .result-info { margin-top: 15px; font-size: 0.95em; color: #b0bec5; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/settings" class="btn btn-gray btn-nav">&laquo; Zurück zu Einstellungen</a>
        <h1>✏️ Falscherkennung bearbeiten / löschen</h1>

        <div class="section">
            <p>Wähle einen Zeitraum und eine Vogelart aus, um die erkannten Einträge anzuzeigen. Du kannst dann KI-Fehler berichtigen oder ganz löschen.</p>
            
            <div class="date-range-row">
                <div class="date-range-col">
                    <label for="date-from">Zeitraum von:</label>
                    <input type="date" id="date-from" required onchange="loadEntries()">
                </div>
                <div class="date-range-col">
                    <label for="date-to">Zeitraum bis:</label>
                    <input type="date" id="date-to" required onchange="loadEntries()">
                </div>
            </div>
            
            <div class="row" style="margin-top: 5px;">
                <label for="species-filter">Nach Vogelart filtern (Pflichtfeld):</label>
                <select id="species-filter" class="filter-select" required onchange="loadEntries()">
                    <option value="">-- Bitte Vogelart wählen --</option>
                </select>
            </div>
            
            <div id="statusMessage" style="margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 5px; display: none;"></div>
            
            <div id="entries-container">
                <div id="result-count" class="result-info"></div>
                <p class="empty-msg" id="empty-msg">Bitte wähle einen Zeitraum und eine Vogelart aus.</p>
                <table id="entries-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Datum &amp; Uhrzeit</th>
                            <th>Vogelart</th>
                            <th>Konfidenz</th>
                            <th style="min-width: 180px;">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="entries-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const speciesList = {{ species_list | tojson }}.sort((a, b) => a.localeCompare(b, 'de'));
        
        // Populate mandatory species filter dropdown
        const speciesFilterEl = document.getElementById('species-filter');
        speciesList.forEach(sp => {
            if (sp && sp.trim() !== '') {
                const opt = document.createElement('option');
                opt.value = sp;
                opt.textContent = sp;
                speciesFilterEl.appendChild(opt);
            }
        });

        // Set default date range to today (local date)
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        document.getElementById('date-from').value = todayStr;
        document.getElementById('date-to').value = todayStr;

        function formatTimestampDE(ts) {
            if (!ts) return '';
            const parts = ts.split(' ');
            const datePart = parts[0] || '';
            const timePart = parts[1] || '';
            const dParts = datePart.split('-');
            if (dParts.length === 3) {
                return `${dParts[2]}.${dParts[1]}.${dParts[0]} ${timePart}`.trim();
            }
            return ts;
        }

        function showMessage(text, isError=false) {
            const msg = document.getElementById('statusMessage');
            msg.style.display = 'block';
            msg.style.backgroundColor = isError ? 'rgba(198, 40, 40, 0.2)' : 'rgba(46, 125, 50, 0.2)';
            msg.style.color = isError ? '#e57373' : '#81c784';
            msg.innerText = text;
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        function updateResultCount(count) {
            const countEl = document.getElementById('result-count');
            if (count > 0) {
                countEl.style.display = 'block';
                countEl.innerText = `Gefundene Einträge: ${count}`;
            } else {
                countEl.style.display = 'none';
            }
        }

        function loadEntries() {
            const startDate = document.getElementById('date-from').value;
            const endDate = document.getElementById('date-to').value;
            const selectedSpecies = document.getElementById('species-filter').value;
            
            const tbody = document.getElementById('entries-body');
            const table = document.getElementById('entries-table');
            const emptyMsg = document.getElementById('empty-msg');

            if (!startDate || !endDate || !selectedSpecies) {
                table.style.display = 'none';
                updateResultCount(0);
                emptyMsg.style.display = 'block';
                emptyMsg.innerText = "Bitte wähle einen Zeitraum und eine Vogelart aus.";
                return;
            }

            if (startDate > endDate) {
                table.style.display = 'none';
                updateResultCount(0);
                emptyMsg.style.display = 'block';
                emptyMsg.innerText = "Das Startdatum („Zeitraum von“) darf nicht nach dem Enddatum („Zeitraum bis“) liegen.";
                showMessage("Ungültiger Zeitraum: Startdatum liegt nach dem Enddatum.", true);
                return;
            }
            
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Lade Einträge...</td></tr>';
            table.style.display = 'table';
            emptyMsg.style.display = 'none';
            updateResultCount(0);

            const params = new URLSearchParams({
                start_date: startDate,
                end_date: endDate,
                species: selectedSpecies
            });

            fetch(`/api/detections/by_date?${params.toString()}`)
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';
                if(data.success) {
                    if(data.entries.length === 0) {
                        table.style.display = 'none';
                        updateResultCount(0);
                        emptyMsg.style.display = 'block';
                        emptyMsg.innerText = `Keine Einträge für „${selectedSpecies}“ im gewählten Zeitraum gefunden.`;
                    } else {
                        updateResultCount(data.entries.length);
                        data.entries.forEach(entry => {
                            let tr = document.createElement('tr');
                            const dateTimeStr = formatTimestampDE(entry.timestamp);
                            
                            // Falls die Art nicht in der Liste ist (z.B. alter englischer Name), temporär hinzufügen
                            let currentOptions = [...speciesList];
                            if (entry.species && !currentOptions.includes(entry.species)) {
                                currentOptions.unshift(entry.species);
                            }
                            
                            tr.innerHTML = `
                                <td>${dateTimeStr}</td>
                                <td>
                                    <select class="edit-select" id="species-${entry.id}">
                                        ${currentOptions.map(s => `<option value="${s}" ${s === entry.species ? 'selected' : ''}>${s}</option>`).join('')}
                                    </select>
                                </td>
                                <td>${Number(entry.confidence * 100).toFixed(0)}%</td>
                                <td>
                                    <button class="btn btn-orange" style="padding: 5px 10px;" onclick="updateEntry(${entry.id})">💾 Save</button>
                                    <button class="btn btn-red" style="padding: 5px 10px; margin-left: 5px;" onclick="deleteEntry(${entry.id}, this)">🗑️ Del</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    table.style.display = 'none';
                    emptyMsg.style.display = 'block';
                    emptyMsg.innerText = data.error || "Fehler beim Laden.";
                    showMessage("Fehler beim Laden: " + data.error, true);
                }
            })
            .catch(err => {
                table.style.display = 'none';
                emptyMsg.style.display = 'block';
                emptyMsg.innerText = "Netzwerkfehler beim Laden!";
                showMessage("Netzwerkfehler beim Laden!", true);
            });
        }
        
        function updateEntry(id) {
            const species = document.getElementById(`species-${id}`).value;
            
            fetch('/api/detections/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, species: species })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showMessage("Eintrag erfolgreich aktualisiert!");
                    loadEntries();
                } else {
                    showMessage("Fehler: " + data.error, true);
                    loadEntries();
                }
            })
            .catch(err => {
                showMessage("Netzwerkfehler beim Speichern!", true);
                loadEntries();
            });
        }
        
        function deleteEntry(id, btnElement) {
            if(!confirm("Diesen Eintrag wirklich endgültig löschen?")) return;
            
            const tr = btnElement.closest('tr');
            btnElement.disabled = true;
            btnElement.innerText = "...";
            
            fetch('/api/detections/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    tr.remove();
                    showMessage("Eintrag erfolgreich gelöscht.");
                    
                    const remaining = document.getElementById('entries-body').children.length;
                    updateResultCount(remaining);
                    if(remaining === 0) {
                        document.getElementById('entries-table').style.display = 'none';
                        document.getElementById('empty-msg').style.display = 'block';
                        document.getElementById('empty-msg').innerText = "Alle Einträge für diesen Zeitraum und diese Vogelart wurden gelöscht.";
                    }
                } else {
                    showMessage("Fehler beim Löschen: " + data.error, true);
                    btnElement.disabled = false;
                    btnElement.innerText = "🗑️ Del";
                }
            })
            .catch(err => {
                showMessage("Netzwerkfehler beim Löschen!", true);
                btnElement.disabled = false;
                btnElement.innerText = "🗑️ Del";
            });
        }
    </script>
</body>
</html>
