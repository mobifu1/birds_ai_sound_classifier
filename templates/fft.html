<!DOCTYPE html>
<html>
<head>
    <title>FFT Analyse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .fft-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            background: #263238;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #37474f;
            color: white;
        }
        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-input {
            padding: 8px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #546e7a;
            background-color: #37474f;
            color: white;
        }
        .submit-btn {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 95%;">
        <div class="header-container">
            <h1>📈 FFT Analyse</h1>
            <div style="margin-top:10px;">
                <a href="/species" class="button-link" style="background:#546e7a;">&laquo; Zurück zu Spezies</a>
            </div>
        </div>

        <div class="fft-controls">
            <form id="fft-form" onsubmit="event.preventDefault(); loadFFT();" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap; width: 100%; justify-content: center;">
                <div class="form-group">
                    <label for="species-select" style="font-weight: bold;">Vogelart:</label>
                    <select name="species" id="species-select" class="control-input" required>
                        <option value="">-- Bitte wählen --</option>
                        {% for sp in all_species %}
                        <option value="{{ sp }}">{{ sp }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="bin-select" style="font-weight: bold;">Zeitauflösung:</label>
                    <select name="bin" id="bin-select" class="control-input">
                        <option value="60">1 Stunde</option>
                        <option value="120">2 Stunden</option>
                        <option value="360">6 Stunden</option>
                        <option value="720">12 Stunden</option>
                        <option value="1440">1 Tag</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="threshold-input" style="font-weight: bold;">Labelschwellwert (%):</label>
                    <input type="number" id="threshold-input" name="threshold" value="15.0" step="0.5" min="0.5" max="50.0" class="control-input" style="width: 80px;">
                </div>

                <div class="form-group">
                    <input type="checkbox" id="raw-checkbox" name="raw" value="1" checked>
                    <label for="raw-checkbox">Zeitreihe anzeigen</label>
                </div>

                <button type="submit" class="submit-btn">Analyse starten</button>
            </form>
        </div>

        <div id="loading-indicator" style="display: none; text-align: center; color: #aaa; margin: 20px 0;">
            <p>Analyse läuft... Bitte warten.</p>
        </div>

        <div id="result-container" style="text-align: center; margin-top: 20px; display: none;">
            <div id="fft-info" style="color: #cdd6f4; background: #2a2a3e; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold;"></div>
            <div>
                <img id="fft-plot" src="" alt="FFT Plot" style="max-width:100%; height:auto; border-radius:8px; border: 1px solid #333;">
            </div>
        </div>
    </div>

    <script>
        function loadFFT() {
            const form = document.getElementById('fft-form');
            const species = form.elements['species'].value;
            if (!species) return;

            const bin = form.elements['bin'].value;
            const threshold = form.elements['threshold'].value;
            const raw = form.elements['raw'].checked ? 1 : 0;

            document.getElementById('loading-indicator').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';

            const url = `/api/fft_plot?species=${encodeURIComponent(species)}&bin=${bin}&threshold=${threshold}&raw=${raw}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading-indicator').style.display = 'none';
                    if (data.error) {
                        alert("Fehler: " + data.error);
                    } else {
                        document.getElementById('fft-info').innerText = data.info;
                        document.getElementById('fft-plot').src = "data:image/png;base64," + data.image;
                        document.getElementById('result-container').style.display = 'block';
                    }
                })
                .catch(err => {
                    document.getElementById('loading-indicator').style.display = 'none';
                    alert("Ein Fehler ist aufgetreten: " + err);
                });
        }
    </script>
</body>
</html>
