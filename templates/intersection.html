<!DOCTYPE html>
<html>
<head>
    <title>Schnittmengen (Intersection)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- D3.js and Venn.js from CDN (cached by browser after first load) -->
    <script src="https://d3js.org/d3.v4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/build/venn.min.js"></script>
    <style>
        .controls-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            background: #263238;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #37474f;
        }
        .form-select {
            padding: 10px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #546e7a;
            background-color: #37474f;
            color: white;
            min-width: 150px;
        }
        .form-select:focus {
            outline: none;
            border-color: #81d4fa;
        }
        .venn-container {
            background: #263238;
            border: 1px solid #37474f;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            overflow: auto;
        }
        .venn-container svg text {
            fill: #ffffff !important;
            font-weight: bold;
        }
        .venn-tooltip {
            position: absolute;
            text-align: center;
            width: 250px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px;
            border: 0px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .species-list {
            margin-top: 8px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            padding-left: 15px;
        }
        .error-msg {
            color: #ff9800;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 95%;">
        <div class="header-container">
            <h1>🔗 Schnittmengen (Intersection)</h1>
            <div style="margin-top:10px;">
                <a href="/" class="button-link" style="background:#546e7a;">&laquo; Zurück zur Übersicht</a>
                <a href="/species" class="button-link" style="background:#4caf50; margin-left: 10px;">🦉 Spezies</a>
            </div>
        </div>

        <div class="controls-container">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <label for="year-select" style="font-weight: bold; color: white;">Jahr:</label>
                <select id="year-select" class="form-select">
                    {% for y in available_years %}
                        <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                    {% endfor %}
                </select>

                <label for="division-select" style="font-weight: bold; color: white; margin-left: 15px;">Aufteilung:</label>
                <select id="division-select" class="form-select">
                    <option value="half">2x Halbjahre</option>
                    <option value="tertial">3x Tertiale</option>
                    <option value="quarter" selected>4x Quartale</option>
                    <option value="month">12x Monate</option>
                </select>
            </div>
        </div>

        <div id="loading" style="text-align:center; color:#81d4fa; display:none; font-size:1.2em; margin-top:20px;">
            Lade Daten und berechne Jaccard-Schnittmengen...
        </div>

        <div id="error-container" class="error-msg" style="display:none;"></div>

        <div id="venn" class="venn-container"></div>
        <div style="text-align:center; color:#aaa; margin-top: 10px; font-size: 0.9em;">
            Tipp: Klicke oder fahre mit der Maus über die Kreise/Schnittflächen, um die Vogelarten in der scrollbaren Liste unten zu sehen.
        </div>
        
        <div id="species-details" style="display:none; background:#263238; border:1px solid #37474f; border-radius:8px; padding:15px; margin-top:20px; text-align:left;">
            <h3 id="species-title" style="margin-top:0; color:#81d4fa;"></h3>
            <div id="species-stats" style="color:#aaa; margin-bottom:15px;"></div>
            <div style="max-height: 250px; overflow-y: auto; padding-right:10px;">
                <div style="display: flex; justify-content: space-between; gap: 20px;">
                    <div style="flex: 1; border-right: 1px solid #37474f; padding-right: 15px;">
                        <h4 id="col-left-title" style="color: #f44336; margin-top: 0; margin-bottom: 10px; font-weight: bold;"></h4>
                        <ul id="col-left-list" style="margin: 0; padding-left: 20px; color: white;"></ul>
                    </div>
                    <div style="flex: 1; border-right: 1px solid #37474f; padding-right: 15px;">
                        <h4 style="color: #4caf50; margin-top: 0; margin-bottom: 10px; font-weight: bold;">Gemeinsam</h4>
                        <ul id="col-mid-list" style="margin: 0; padding-left: 20px; color: white;"></ul>
                    </div>
                    <div style="flex: 1;">
                        <h4 id="col-right-title" style="color: #f44336; margin-top: 0; margin-bottom: 10px; font-weight: bold;"></h4>
                        <ul id="col-right-list" style="margin: 0; padding-left: 20px; color: white;"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            {{ version }}
        </div>
    </div>

    <script>
        const yearSelect = document.getElementById('year-select');
        const divisionSelect = document.getElementById('division-select');
        const vennContainer = document.getElementById('venn');
        const loading = document.getElementById('loading');
        const errorContainer = document.getElementById('error-container');

        // Tooltip setup
        var tooltip = d3.select("body").append("div")
            .attr("class", "venn-tooltip")
            .style("display", "none");

        function loadData() {
            const year = yearSelect.value;
            const division = divisionSelect.value;
            
            vennContainer.innerHTML = "";
            errorContainer.style.display = "none";
            vennContainer.style.display = "none";
            loading.style.display = "block";

            fetch(`/api/intersection_data?year=${year}&division=${division}`)
                .then(response => response.json())
                .then(data => {
                    loading.style.display = "none";
                    
                    if (data.error) {
                        errorContainer.innerText = data.error;
                        errorContainer.style.display = "block";
                        return;
                    }

                    if (!data.data || data.data.length === 0) {
                        errorContainer.innerText = "Zu wenig Daten für die gewählten Zeiträume vorhanden.";
                        errorContainer.style.display = "block";
                        return;
                    }

                    vennContainer.style.display = "block";
                    drawVenn(data.data);
                })
                .catch(err => {
                    loading.style.display = "none";
                    errorContainer.innerText = "Fehler beim Laden der Daten.";
                    errorContainer.style.display = "block";
                    console.error(err);
                });
        }

        function drawVenn(data) {
            var chart = venn.VennDiagram()
                .width(800)
                .height(500);
            
            var div = d3.select("#venn");
            div.datum(data).call(chart);

            div.selectAll("path")
                .style("stroke-opacity", 0)
                .style("stroke", "#fff")
                .style("stroke-width", 3);

            div.selectAll("g")
                .on("mouseover", function(d, i) {
                    // Sort nodes
                    venn.sortAreas(div, d);
                    
                    // Highlight
                    var selection = d3.select(this).transition("tooltip").duration(400);
                    selection.select("path")
                        .style("fill-opacity", d.sets.length == 1 ? .4 : .1)
                        .style("stroke-opacity", 1);
                    
                    tooltip.transition().duration(400).style("opacity", .9);
                    
                    // Construct text
                    let title = d.sets.join(" ∩ ");
                    
                    let jaccardText = "";
                    if(d.sets.length > 1 && d.jaccard !== undefined) {
                        jaccardText = `<br><span style="color:#4caf50;">Jaccard-Faktor: ${(d.jaccard * 100).toFixed(1)}%</span>`;
                    }

                    // Floating Tooltip (ohne die riesige Artenliste!)
                    tooltip.html(`<strong>${title}</strong><br>Anzahl Arten: ${d.size}${jaccardText}`)
                           .style("display", "block");
                           
                    // Fixe Scrollbox updaten (Nur bei Schnittmengen relevant)
                    if (d.sets.length > 1) {
                        var allData = d3.select("#venn").datum();
                        var s1Name = d.sets[0];
                        var s2Name = d.sets[1];
                        var s1Obj = allData.find(x => x.sets.length === 1 && x.sets[0] === s1Name);
                        var s2Obj = allData.find(x => x.sets.length === 1 && x.sets[0] === s2Name);
                        
                        var sharedSpecies = d.species || [];
                        var s1Only = s1Obj ? s1Obj.species.filter(s => !sharedSpecies.includes(s)) : [];
                        var s2Only = s2Obj ? s2Obj.species.filter(s => !sharedSpecies.includes(s)) : [];
                        
                        sharedSpecies.sort((a, b) => a.localeCompare(b));
                        s1Only.sort((a, b) => a.localeCompare(b));
                        s2Only.sort((a, b) => a.localeCompare(b));
                        
                        document.getElementById("col-left-title").innerText = `Nur in ${s1Name}`;
                        document.getElementById("col-right-title").innerText = `Nur in ${s2Name}`;
                        
                        document.getElementById("col-left-list").innerHTML = s1Only.map(s => `<li style="color:#f44336; margin-bottom: 3px;">${s}</li>`).join('');
                        document.getElementById("col-mid-list").innerHTML = sharedSpecies.map(s => `<li style="color:#4caf50; margin-bottom: 3px;">${s}</li>`).join('');
                        document.getElementById("col-right-list").innerHTML = s2Only.map(s => `<li style="color:#f44336; margin-bottom: 3px;">${s}</li>`).join('');

                        document.getElementById("species-title").innerHTML = title;
                        document.getElementById("species-stats").innerHTML = `Gemeinsame Arten: ${d.size} ${jaccardText}`;
                        document.getElementById("species-details").style.display = "block";
                    }
                })
                .on("mousemove", function() {
                    tooltip.style("left", (d3.event.pageX + 15) + "px")
                           .style("top", (d3.event.pageY - 28) + "px");
                })
                .on("mouseout", function(d, i) {
                    tooltip.transition().duration(400).style("opacity", 0).on("end", function() {
                        tooltip.style("display", "none");
                    });
                    var selection = d3.select(this).transition("tooltip").duration(400);
                    selection.select("path")
                        .style("fill-opacity", d.sets.length == 1 ? .25 : .0)
                        .style("stroke-opacity", 0);
                });
        }

        yearSelect.addEventListener('change', loadData);
        divisionSelect.addEventListener('change', loadData);

        // Initial load
        loadData();
    </script>
</body>
</html>
